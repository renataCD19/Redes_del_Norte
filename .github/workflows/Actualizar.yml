name: Actualizar datos

on:
  schedule:
    - cron: '0 12 * * *'   # todos los días a las 06:00 hora de México (12:00 UTC)
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write           # necesario para que el bot pueda guardar data.json

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar noticias y generar data.json
        run: python scripts/actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Actualizar datos $(date -u +%F)"
          git push
